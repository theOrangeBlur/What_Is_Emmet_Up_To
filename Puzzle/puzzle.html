<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hexdoku | Emmet</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="apple-touch-icon" sizes="180x180" href="/media/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/media/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/media/favicon/favicon-16x16.png">
  <link rel="manifest" href="/media/favicon/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <nav class="top-nav">
    <a href="../index.html">Take me home, please!</a>
  </nav>

  <h1>Hexdoku</h1>
  <button id="lefty-btn">Lefty mode!</button>

  <div class="instructions-box">
    <p>Learn each level's rules from the completed puzzle on the left. Use these rules to complete the puzzle on the right.</p>
  </div>

  <!-- Level 1 -->
  <section class="level" id="level-1">
    <h2>Level 1</h2>
    <div class="puzzle-row">
      <div class="grid-wrap">
        <h3>Reference</h3>
        <svg id="l1-complete" class="hex-grid"></svg>
      </div>
      <div class="grid-wrap">
        <h3>Puzzle</h3>
        <svg id="l1-puzzle" class="hex-grid"></svg>
      </div>
    </div>
    <div class="check-row">
      <button class="check-btn" id="check-btn-1">Check</button>
      <button class="clear-btn" id="clear-btn-1"><span class="clear-bar"></span>Clear</button>
      <div class="check-result" id="l1-result"></div>
    </div>
  </section>

  <!-- Level 2 -->
  <section class="level" id="level-2">
    <h2>Level 2</h2>
    <div class="puzzle-row">
      <div class="grid-wrap">
        <h3>Reference</h3>
        <svg id="l2-complete" class="hex-grid"></svg>
      </div>
      <div class="grid-wrap">
        <h3>Puzzle</h3>
        <svg id="l2-puzzle" class="hex-grid"></svg>
      </div>
    </div>
    <div class="check-row">
      <button class="check-btn" id="check-btn-2">Check</button>
      <button class="clear-btn" id="clear-btn-2"><span class="clear-bar"></span>Clear</button>
      <div class="check-result" id="l2-result"></div>
    </div>
  </section>

  <!-- Level 3 -->
  <section class="level" id="level-3">
    <h2>Level 3</h2>
    <div class="puzzle-row">
      <div class="grid-wrap">
        <h3>Reference</h3>
        <svg id="l3-complete" class="hex-grid"></svg>
      </div>
      <div class="grid-wrap">
        <h3>Puzzle</h3>
        <svg id="l3-puzzle" class="hex-grid"></svg>
      </div>
    </div>
    <div class="check-row">
      <button class="check-btn" id="check-btn-3">Check</button>
      <button class="clear-btn" id="clear-btn-3"><span class="clear-bar"></span>Clear</button>
      <div class="check-result" id="l3-result"></div>
    </div>
  </section>

  <script src="./hexdoku.js"></script>
  <div id="mobile-numbar" aria-label="Number input" role="toolbar">
    <button class="numbar-btn" data-value="1">
      <svg viewBox="0 0 20 30" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="15" r="3"/>
      </svg>
    </button>
    <button class="numbar-btn" data-value="2">
      <svg viewBox="0 0 20 30" xmlns="http://www.w3.org/2000/svg">
        <circle cx="10" cy="7" r="3"/>
        <circle cx="10" cy="23" r="3"/>
      </svg>
    </button>
    <button class="numbar-btn" data-value="3">
      <svg viewBox="0 0 20 30" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="7" r="3"/>
        <circle cx="10" cy="15" r="3"/>
        <circle cx="6" cy="23" r="3"/>
      </svg>
    </button>
    <button class="numbar-btn" data-value="4">
      <svg viewBox="0 0 20 30" xmlns="http://www.w3.org/2000/svg">
        <circle cx="6" cy="7" r="3"/>
        <circle cx="14" cy="7" r="3"/>
        <circle cx="6" cy="23" r="3"/>
        <circle cx="14" cy="23" r="3"/>
      </svg>
    </button>
    <button class="numbar-btn" data-value="5">
      <svg viewBox="0 0 20 30" xmlns="http://www.w3.org/2000/svg">
        <circle cx="6" cy="7" r="3"/>
        <circle cx="14" cy="7" r="3"/>
        <circle cx="10" cy="15" r="3"/>
        <circle cx="6" cy="23" r="3"/>
        <circle cx="14" cy="23" r="3"/>
      </svg>
    </button>
    <button class="numbar-btn" data-value="6">
      <svg viewBox="0 0 20 30" xmlns="http://www.w3.org/2000/svg">
        <circle cx="6" cy="7" r="3"/>
        <circle cx="14" cy="7" r="3"/>
        <circle cx="6" cy="15" r="3"/>
        <circle cx="14" cy="15" r="3"/>
        <circle cx="6" cy="23" r="3"/>
        <circle cx="14" cy="23" r="3"/>
      </svg>
    </button>
    <button class="numbar-btn numbar-clear" data-value="0">
      <svg viewBox="0 0 22 18" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="3" width="20" height="11" rx="2" fill="#ffc0c0"/>
        <rect x="1" y="3" width="9" height="11" rx="2" fill="#e07070"/>
        <line x1="10" y1="3" x2="10" y2="14" stroke="white" stroke-width="1" stroke-opacity="0.5"/>
      </svg>
    </button>
  </div>
</body>
</html>
