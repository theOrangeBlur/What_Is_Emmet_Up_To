name: Stitch Videos from Google Photos

on:
  # Run every Monday at 00:00 UTC (weekly)
  schedule:
    - cron: '0 0 * * 1'

  # Allow manual triggering
  workflow_dispatch:

jobs:
  stitch:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r Visaul-Stitch/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg installation
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Set up Google Cloud credentials
        run: |
          echo '${{ secrets.GCS_SERVICE_ACCOUNT_KEY }}' > /tmp/gcs-key.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcs-key.json

      - name: Set up Google Photos credentials
        run: |
          cd Visaul-Stitch
          echo '${{ secrets.GOOGLE_PHOTOS_CLIENT_SECRET }}' > client_secret.json
          echo '${{ secrets.GOOGLE_PHOTOS_TOKEN }}' > token.json

      - name: Process media from Google Photos
        env:
          GOOGLE_PHOTOS_TOKEN: ${{ secrets.GOOGLE_PHOTOS_TOKEN }}
          GOOGLE_PHOTOS_ALBUM_ID: ${{ secrets.GOOGLE_PHOTOS_ALBUM_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcs-key.json
        run: |
          cd Visaul-Stitch
          python process-media-gcloud.py \
            --upload-to-gcs \
            --gcs-path "compilation.mp4"

      - name: Verify output was created and uploaded
        run: |
          if [ -f "Visaul-Stitch/output/compilation.mp4" ]; then
            echo "✓ Compilation video created successfully"
            ls -lh Visaul-Stitch/output/compilation.mp4
          else
            echo "✗ Compilation video was not created"
            exit 1
          fi

      - name: Clean up credentials
        if: always()
        run: |
          rm -f /tmp/gcs-key.json
          rm -f Visaul-Stitch/client_secret.json
          rm -f Visaul-Stitch/token.json
