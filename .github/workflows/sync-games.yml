name: Sync Game Reviews

on:
  schedule:
    # Runs every day at 1:00 AM EST (6:00 AM UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual triggering

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Google Sheet data
        run: |
          curl -L "https://docs.google.com/spreadsheets/d/1f1dq5qxQIRBwPIGzndl_ApOrwJ0dB29_in4ttqRrXMc/export?format=csv" -o Game_review/src/games.csv
          echo "Downloaded CSV:"
          head -5 Game_review/src/games.csv

      - name: Fetch Google Doc reviews
        run: |
          curl -L "https://docs.google.com/document/d/11qfBD3qx2nzRz-QpZl4IywJSB3oqsIvcYhNt_21dBsA/export?format=txt" -o Game_review/src/reviews.md
          echo "Downloaded reviews:"
          head -5 Game_review/src/reviews.md

      - name: Set up RAWG API key
        run: |
          echo '{"rawg_api_key": "${{ secrets.RAWG_API_KEY }}"}' > Game_review/config.json

      - name: Build game reviews page
        run: |
          cd Game_review
          python build.py

      - name: Check if data changed
        id: check_changes
        run: |
          if git diff --quiet Game_review/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add Game_review/src/games.csv Game_review/src/reviews.md Game_review/games.html Game_review/src/image_cache.json
          git commit -m "Update game review data [automated]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
