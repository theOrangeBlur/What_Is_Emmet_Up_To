name: Generate Daily Wordle Word

on:
  schedule:
    - cron: '5 5 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute and store today's word
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, datetime, urllib.request

          with open('Puzzles/Final_Wordle/words.json', encoding='utf-8-sig') as f:
              words = json.load(f)

          with open('Puzzles/Final_Wordle/valid-guesses.json', encoding='utf-8-sig') as f:
              valid_guesses = json.load(f)

          all_words = list(dict.fromkeys(words + valid_guesses))

          url = 'https://nsocmpzeccpoatrfddjf.supabase.co'
          key = os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '').strip()

          def seeded_rng(seed):
              s = [seed % 2147483647]
              if s[0] <= 0: s[0] += 2147483646
              def rng():
                  s[0] = s[0] * 16807 % 2147483647
                  return (s[0] - 1) / 2147483646
              return rng

          def score_guess(guess, answer):
              res = ['dark'] * 5
              used = [False] * 5
              for i in range(5):
                  if guess[i] == answer[i]:
                      res[i] = 'green'
                      used[i] = True
              for i in range(5):
                  if res[i] == 'green':
                      continue
                  for j in range(5):
                      if not used[j] and guess[i] == answer[j]:
                          res[i] = 'yellow'
                          used[j] = True
                          break
              return res

          def filter_words(wds, guess, result):
              return [w for w in wds if score_guess(guess, w) == result]

          def best_guess(candidates, rng):
              if len(candidates) <= 2:
                  return candidates[0]
              sample = [c for c in candidates if rng() < 10 / len(candidates)]
              pool = sample if len(sample) >= 2 else candidates[:2]
              best = candidates[0]
              best_score = float('inf')
              for g in pool:
                  buckets = {}
                  for c in candidates:
                      k = ''.join(score_guess(g, c))
                      buckets[k] = buckets.get(k, 0) + 1
                  s = max(buckets.values())
                  if s < best_score or (s == best_score and g in candidates):
                      best_score = s
                      best = g
              return best

          def generate_puzzle(seed, forced_answer=None, word_pool=None):
              rng = seeded_rng(seed)
              pool = word_pool if word_pool else words
              # Always draw this, even when forced_answer overrides it: skipping it would
              # shift first_guess into the position of a seed's near-frozen first draw
              # (seeded_rng's first output barely moves for seed+1), collapsing sticky
              # retries onto the same guess path instead of varying it.
              drawn_answer = pool[int(rng() * len(pool))]
              answer = forced_answer or drawn_answer
              starters = ['crane','slate','audio','raise','stare','stern','cloud','plant']
              first_guess = starters[int(rng() * len(starters))]
              remaining = list(words)
              guesses, results = [], []
              attempts = 0
              while len(remaining) > 1:
                  g = first_guess if attempts == 0 else best_guess(remaining, rng)
                  r = score_guess(g, answer)
                  guesses.append(g)
                  results.append(r)
                  remaining = filter_words(remaining, g, r)
                  attempts += 1
                  if len(remaining) == 1:
                      break
              full_remaining = list(all_words)
              for i in range(len(guesses)):
                  full_remaining = filter_words(full_remaining, guesses[i], results[i])
              unique_across_all = len(full_remaining) == 1 and full_remaining[0] == answer
              return {'answer': answer, 'guesses': guesses, 'results': results, 'unique_across_all': unique_across_all}

          def score_puzzle(results):
              score = 0
              for row in results:
                  for s in row:
                      if s == 'green': score += 15
                      elif s == 'yellow': score += 5
                      else: score += 1
              return score

          MAX_TRIES_PER_WORD = 1500  # guess-path attempts on one answer before giving up and moving to a new word

          def is_puzzle_accepted(puzzle):
              return (puzzle['unique_across_all'] and
                      not (puzzle['guesses'] and puzzle['guesses'][-1] == puzzle['answer']) and
                      score_puzzle(puzzle['results']) <= 40)

          today = datetime.datetime.utcnow() - datetime.timedelta(hours=5)  # EST
          day_key = today.year * 10000 + today.month * 100 + today.day
          seed = (day_key * 48271) % 2147483647
          if seed <= 0: seed += 2147483646

          REPEAT_AVOID_DAYS = 90  # don't reuse an answer word that appeared in the last N days

          def fetch_recent_words():
              cutoff = today - datetime.timedelta(days=REPEAT_AVOID_DAYS)
              cutoff_key = cutoff.year * 10000 + cutoff.month * 100 + cutoff.day
              req = urllib.request.Request(
                  f"{url}/rest/v1/daily_words?select=word&date=gte.{cutoff_key}",
                  headers={'apikey': key, 'Authorization': f'Bearer {key}'},
              )
              with urllib.request.urlopen(req) as r:
                  rows = json.loads(r.read().decode())
              return {row['word'].lower() for row in rows}

          try:
              recent_words = fetch_recent_words()
          except Exception as e:
              print(f"Warning: could not fetch recent words, skipping repeat check: {e}")
              recent_words = set()

          word_pool = [w for w in words if w.lower() not in recent_words] or words
          print(f"Excluding {len(words) - len(word_pool)} word(s) used in the last {REPEAT_AVOID_DAYS} days")

          # Keeps retrying the SAME answer word (new guess path each time, since seed+1
          # barely shifts the RNG's first draw but reshuffles everything after it) for up
          # to MAX_TRIES_PER_WORD attempts before giving up and letting the next unforced
          # draw pick a new word — by then the seed has advanced well past one answer
          # word's ~124-wide RNG bucket, so a new word is all but guaranteed.
          puzzle = generate_puzzle(seed, word_pool=word_pool)
          sticky_answer = puzzle['answer']
          tries_on_word = 1
          words_tried = [sticky_answer]
          total_attempts = 1
          while not is_puzzle_accepted(puzzle):
              seed = (seed % 2147483646) + 1
              total_attempts += 1
              if tries_on_word >= MAX_TRIES_PER_WORD:
                  puzzle = generate_puzzle(seed, word_pool=word_pool)
                  sticky_answer = puzzle['answer']
                  tries_on_word = 1
                  words_tried.append(sticky_answer)
              else:
                  puzzle = generate_puzzle(seed, sticky_answer)
                  tries_on_word += 1

          word = puzzle['answer']
          print(f"Tried {len(words_tried)} distinct word(s) across {total_attempts} total attempts: {words_tried}")
          print(f"Date key: {day_key}, Word: {word}, Guesses: {puzzle['guesses']}")

          payload = json.dumps({
              'date': day_key,
              'word': word,
              'guesses': puzzle['guesses'],
              'results': puzzle['results']
          }).encode()
          req = urllib.request.Request(
              f"{url}/rest/v1/daily_words",
              data=payload,
              headers={
                  'apikey': key,
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
                  'Prefer': 'resolution=merge-duplicates'
              },
              method='POST'
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print(f"Stored: HTTP {r.status}")
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}: {e.read().decode()}")
              raise
          EOF
