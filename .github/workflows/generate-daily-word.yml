name: Generate Daily Wordle Word

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute and store today's word
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, datetime, urllib.request, re

          with open('Puzzles/Final_Wordle/final-wordle.js') as f:
              content = f.read()
          match = re.search(r'const WORDS = \[([^\]]+)\]', content)
          words = [w.strip().strip('"') for w in match.group(1).split(',')]

          # Read Supabase URL from the HTML (public value); key comes from secret
          with open('Puzzles/Final_Wordle/final-wordle.html') as f:
              html = f.read()
          url = re.search(r"window\.SUPABASE_URL\s*=\s*'([^']+)'", html).group(1)
          key = os.environ.get('SUPABASE_SERVICE_ROLE_KEY', '').strip()
          print(f"Key length: {len(key)}")

          def seeded_rng(seed):
              s = [seed % 2147483647]
              if s[0] <= 0: s[0] += 2147483646
              def rng():
                  s[0] = s[0] * 16807 % 2147483647
                  return (s[0] - 1) / 2147483646
              return rng

          today = datetime.date.today()  # GitHub Actions runners use UTC
          day_key = today.year * 10000 + today.month * 100 + today.day
          seed = (day_key * 48271) % 2147483647
          if seed <= 0: seed += 2147483646
          rng = seeded_rng(seed)
          word = words[int(rng() * len(words))]

          print(f"Date key: {day_key}, Word: {word}")

          payload = json.dumps({'date': day_key, 'word': word}).encode()
          req = urllib.request.Request(
              f"{url}/rest/v1/daily_words",
              data=payload,
              headers={
                  'apikey': key,
                  'Authorization': f'Bearer {key}',
                  'Content-Type': 'application/json',
                  'Prefer': 'resolution=merge-duplicates'
              },
              method='POST'
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print(f"Stored: HTTP {r.status}")
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}: {e.read().decode()}")
              raise
          EOF
