name: Crown Monthly Champions

# Gives last month's winner of each daily puzzle its champion award
# (crown_monthly_champions in supabase/leaderboards.sql). Runs every day so a
# missed run on the 1st still catches up; re-running changes nothing.
on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

jobs:
  crown:
    runs-on: ubuntu-latest
    steps:
      - name: Crown last month's champions
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '[:space:]')"
          curl --fail-with-body -sS -X POST \
            'https://nsocmpzeccpoatrfddjf.supabase.co/rest/v1/rpc/crown_monthly_champions' \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            -d '{}'
          echo
