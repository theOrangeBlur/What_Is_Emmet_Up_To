name: Crown Champions

# Hands out the daily puzzles' champion awards (crown_champions in
# supabase/leaderboards.sql): last month's and last week's winners of each
# puzzle, and the winners of the last few days. Runs every day just after the
# EST day ends, so a missed run still catches up; re-running changes nothing.
on:
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

jobs:
  crown:
    runs-on: ubuntu-latest
    steps:
      - name: Crown champions
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          KEY="$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '[:space:]')"
          curl --fail-with-body -sS -X POST \
            'https://nsocmpzeccpoatrfddjf.supabase.co/rest/v1/rpc/crown_champions' \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            -d '{}'
          echo
