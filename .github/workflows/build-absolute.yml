name: Build Absolute

# The site is served straight from the repo, but Absolute is a Vite + TypeScript
# project. This builds it and commits the static output to Puzzles/Absolute/play/.
on:
  push:
    branches: [main]
    paths:
      - 'Puzzles/Absolute/**'
      - '!Puzzles/Absolute/play/**'
      - '.github/workflows/build-absolute.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-absolute
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Puzzles/Absolute
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Puzzles/Absolute/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

      - name: Replace play/ with the new build
        run: |
          rm -rf play
          cp -r dist play

      - name: Commit build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A play
          git diff --cached --quiet && { echo "Build unchanged."; exit 0; }
          git commit -m "Build Absolute [automated]"
          git pull --rebase
          git push
