name: Stitch Videos from Google Drive

on:
  # Run every Monday at 00:00 UTC (weekly)
  schedule:
    - cron: '0 0 * * 1'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      delete_after_process:
        description: 'Delete source files from Drive after processing'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      start_month:
        description: 'Start month (YYYY-MM, inclusive). Leave empty for all months.'
        required: false
        type: string
      end_month:
        description: 'End month (YYYY-MM, inclusive). Leave empty for all months.'
        required: false
        type: string

jobs:
  stitch:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r Visual-Stitch/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg installation
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Set up Google Cloud credentials
        run: |
          echo '${{ secrets.GCS_SERVICE_ACCOUNT_KEY }}' > /tmp/gcs-key.json

      - name: Set up Google Drive credentials
        run: |
          cd Visual-Stitch
          echo '${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}' > client_secret.json
          echo '${{ secrets.GOOGLE_DRIVE_TOKEN }}' > token.json

      - name: Process media from Google Drive
        env:
          GOOGLE_DRIVE_TOKEN: ${{ secrets.GOOGLE_DRIVE_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcs-key.json
        run: |
          cd Visual-Stitch
          DELETE_FLAG=""
          if [ "${{ github.event.inputs.delete_after_process }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            DELETE_FLAG="--delete-after-process"
          fi
          MONTH_FLAGS=""
          if [ -n "${{ github.event.inputs.start_month }}" ]; then
            MONTH_FLAGS="$MONTH_FLAGS --start-month ${{ github.event.inputs.start_month }}"
          fi
          if [ -n "${{ github.event.inputs.end_month }}" ]; then
            MONTH_FLAGS="$MONTH_FLAGS --end-month ${{ github.event.inputs.end_month }}"
          fi
          python process-media-gdrive.py \
            --upload-to-gcs \
            --gcs-path "compilation.mp4" \
            $DELETE_FLAG \
            $MONTH_FLAGS

      - name: Verify output was created and uploaded
        run: |
          if [ -f "Visual-Stitch/output/compilation.mp4" ]; then
            echo "Compilation video created successfully"
            ls -lh Visual-Stitch/output/compilation.mp4
          else
            echo "Compilation video was not created"
            exit 1
          fi

      - name: Clean up credentials
        if: always()
        run: |
          rm -f /tmp/gcs-key.json
          rm -f Visual-Stitch/client_secret.json
          rm -f Visual-Stitch/token.json
