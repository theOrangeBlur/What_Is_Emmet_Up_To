name: Stitch Videos from Google Drive

on:
  # Run every Monday at 00:00 UTC (weekly)
  schedule:
    - cron: '0 0 * * 1'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild all months (ignore GCS manifests)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      start_month:
        description: 'Start month (YYYY-MM, inclusive). Leave empty for all months.'
        required: false
        type: string
      end_month:
        description: 'End month (YYYY-MM, inclusive). Leave empty for all months.'
        required: false
        type: string

jobs:
  stitch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r Visual-Stitch/requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify FFmpeg installation
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Set up Google credentials
        run: |
          echo '${{ secrets.GCS_SERVICE_ACCOUNT_KEY }}' > /tmp/gcs-key.json

      - name: Process media from Google Drive
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcs-key.json
        run: |
          cd Visual-Stitch
          FLAGS=""
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ]; then
            FLAGS="$FLAGS --force-rebuild"
          fi
          if [ -n "${{ github.event.inputs.start_month }}" ]; then
            FLAGS="$FLAGS --start-month ${{ github.event.inputs.start_month }}"
          fi
          if [ -n "${{ github.event.inputs.end_month }}" ]; then
            FLAGS="$FLAGS --end-month ${{ github.event.inputs.end_month }}"
          fi
          python process-media-gdrive.py \
            --upload-to-gcs \
            --gcs-path "compilation.mp4" \
            $FLAGS

      - name: Verify output was created and uploaded
        run: |
          if [ -f "Visual-Stitch/output/compilation.mp4" ]; then
            echo "Compilation video created successfully"
            ls -lh Visual-Stitch/output/compilation.mp4
          else
            echo "Compilation video was not created"
            exit 1
          fi

      - name: Commit metadata to repo
        run: |
          cp Visual-Stitch/output/compilation-metadata.json Visual-Stitch/compilation-metadata.json
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add Visual-Stitch/compilation-metadata.json
          git commit -m "Update compilation metadata [automated]" || echo "No metadata changes to commit"
          git push

      - name: Clean up credentials
        if: always()
        run: |
          rm -f /tmp/gcs-key.json
